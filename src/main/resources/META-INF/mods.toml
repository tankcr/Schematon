modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
#issueTrackerURL="https://github.com/tankcr/Schematon/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile= "../assets/logo.png"
logoBlur=false
#displayURL="https://www.curseforge.com/minecraft/mc-mods/schematon"

# Client-only in v1.0.0: prevents a red 'X' when joining vanilla/unmodded multiplayer servers
displayTest="IGNORE_ALL_VERSION"

description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[modproperties.${mod_id}]
catalogueImageIcon="../assets/icon.png"